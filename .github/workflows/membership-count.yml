name: CCC Membership Statistics Sync
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ccc-membership-statistics
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check credential configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Firebase credential not configured; no database changes made."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@13
      - name: Synchronize Firebase Authentication count
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-membership-count.cjs
