<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Cosmic Jukebox</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#080515 radial-gradient(ellipse at center,#30204c,transparent 75%);color:#fff;font-family:system-ui,sans-serif}main{min-height:100svh;display:grid;align-content:center;justify-items:center;gap:18px;padding:24px 12px 80px;text-align:center}h1{font:clamp(30px,5vw,56px) Georgia,serif;margin:0;color:#fff0bb;text-shadow:0 0 20px #b479ff}p{margin:8px 0;color:#e5d5f8}.art{position:relative;width:min(100%,1100px);overflow:hidden;border-radius:16px;box-shadow:0 0 40px #b26cf333;border:1px solid #caa95d66}.art img{display:block;width:100%;height:auto;opacity:.96;transform:translateY(var(--shift,0px));transition:transform .2s ease-out}.stars{position:absolute;inset:0;pointer-events:none}.stars i{position:absolute;color:#fff4bc;text-shadow:0 0 10px gold;font-style:normal;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.15}to{opacity:.9}}a{position:fixed;bottom:16px;left:16px;display:grid;place-items:center;width:52px;height:52px;background:#176a45;border:2px solid #a5e4a6;border-radius:50%;color:white;text-decoration:none;font-size:25px}a:focus-visible{outline:3px solid white}@media(prefers-reduced-motion:reduce){.stars i{animation:none}.art img{transform:none}}</style></head><body><main><header><h1>The Cosmic Jukebox</h1><p>Music · Mathematics · Geometry</p></header><div class="art"><img src="cosmic-jukebox.png" alt="Cosmic jukebox radiating rainbow waves, music, mathematics and geometry"><div class="stars" aria-hidden="true"><i style="left:8%;top:12%">✦</i><i style="left:88%;top:20%;animation-delay:-1s">✧</i><i style="left:19%;top:81%;animation-delay:-2s">✦</i><i style="left:92%;top:75%;animation-delay:-.5s">✦</i></div></div></main><a href="../" aria-label="Return to Young Masters">⌂</a><script>const art=document.querySelector('.art');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){art.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const r=art.getBoundingClientRect();art.style.setProperty('--shift',((e.clientY-r.top)/r.height-.5)*4+'px')}});art.addEventListener('pointerleave',()=>art.style.setProperty('--shift','0px'))}</script></body></html>
