<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opus • Young Masters</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e6;color:#192e25;font:16px/1.5 "DM Sans",system-ui,sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #b9b9a9;gap:12px}.brand{font-weight:800;letter-spacing:.13em;font-size:13px}.rose{font-size:25px;color:#337152;vertical-align:middle}nav{display:flex;flex-wrap:wrap;gap:5px}button{font:inherit;cursor:pointer;border:1px solid #a1ac99;border-radius:6px;background:#fffcf3;color:inherit;padding:9px 14px}button:hover{background:#e8eddd}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #ab731c;outline-offset:2px}nav button{font-size:14px}.active,.primary{background:#244d39;color:white}.active:hover,.primary:hover{background:#376447}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.12}h1{font-size:clamp(45px,7vw,80px);margin:10px 0}h2{font-size:31px;margin:20px 0 10px}h3{font-size:23px;margin:6px 0}.hero{background:repeating-radial-gradient(circle at 95% 95%,transparent 0 21px,#caae7130 22px 23px,transparent 24px 39px),#193d30;color:#fff8e6;padding:clamp(22px,5vw,46px);border-radius:12px}.hero p{max-width:540px}.eyebrow,small{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.tile{text-align:left;padding:18px;background:#fffdf6;box-shadow:0 3px 0 #ded9c9}.tile b{font-family:Georgia,serif;display:block;font-size:24px;font-weight:500}.tile span{display:block;font-size:14px}.glyph{font-size:26px!important;color:#647843}.panel,details{border:1px solid #c6c8b6;border-radius:9px;background:#fffdf6;padding:18px;margin:12px 0}.panel p{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:650}label{display:block;font-weight:650;margin:14px 0}input,textarea,select{display:block;width:100%;padding:11px;font:inherit;color:inherit;border:1px solid #abb2a2;border-radius:5px;background:white;margin-top:4px}textarea{min-height:74px}select{max-width:320px}footer{font-size:13px;color:#506453}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#notice{color:#734b12}h2,p{overflow-wrap:anywhere}@media(max-width:600px){header{display:block}nav{margin-top:10px}header,main,footer{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:12px}.tile b{font-size:21px}}
article p{white-space:pre-wrap;overflow-wrap:anywhere}.checklist li{margin:.35em 0}.report{max-width:740px;margin:25px auto}.report h3{margin-top:1.3em}.report h4{margin-bottom:2px}.report p{margin-top:3px}.report dl{display:grid;grid-template-columns:minmax(7em,30%) 1fr;gap:.35em 1em}.report dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.report dt{font-weight:650}@media print{@page{margin:16mm}body{background:white;color:black}.tools,header,footer,nav,button{display:none!important}main,.report{max-width:none;padding:0;margin:0}.report h1{font-size:32pt}.report h2{font-size:20pt;border-bottom:1px solid}.report h2,.report h3,.report h4{break-after:avoid}.report dl{display:block}.report dd{margin:0 0 6pt}.report dt{break-after:avoid}}.video-button{display:inline-block;background:#fff8e6;color:#193d30;padding:10px 16px;border-radius:6px;font-weight:650;text-decoration:none}.video-button:hover{text-decoration:underline}.video-button:focus-visible{outline:3px solid gold;outline-offset:3px}</style><header><div class="brand"><span class="rose">❀</span> YOUNG MASTERS</div><nav aria-label="Game pages"></nav></header><main id="main"></main><footer>Green Rose Organization · Designed for Young Masters by Appakernicus<div id="notice" role="status"></div></footer>
<script>
const domains=['Career','Recreation','Education','Financial','Family','Community','Spiritual'],glyph=['⚒','☀','✎','◈','⌂','✿','✧'],hints=['Build your working life','Make room for play','Learn a skill','Shape a money habit','Care for a connection','Contribute where you live','Explore what gives life meaning'];
const pillars='Awareness Autonomy Balance Beauty Celebration Change Compassion Courage Creativity Curiosity Empathy Equanimity Faith Fidelity Forgiveness Gratitude Humility Honesty Industry Integrity Joy Justice Love Modesty Nurturance Patience Potential Purpose Resilience Respect Responsibility Romance Service Simplicity Temperance Zeal'.split(' ');
const compass=['General purpose','Vision','Evidence procedure','Mission','Philosophy','Value hierarchy'],cp=['Why do these goals matter to you?','Who are you growing into?','What have you done before that gives you confidence in this plan?','What will you commit to doing?','What idea guides your choices?','Which values come first when two pull in different directions?'];
const groups={'Define the quest':['Executive summary','Objectives'],'Picture the outcome':['What will you see?','What will you hear?','What will you feel?'],'Prepare yourself':['Evidence within your control','Available resources','Attitude','Beliefs','Character','Skills'],'Meet the obstacle':['Potential obstacles','Plan of action','Your environment afterward']};
const key='ym-opus-1',main=document.querySelector('main'),nav=document.querySelector('nav');let state={quests:[],compass:{}},page='Board',id,warning='';
try{let raw=localStorage.getItem(key);if(raw)state=JSON.parse(raw)}catch{warning='Device saving is unavailable.'}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{warning='Device saving is unavailable. Keep this tab open.'}document.querySelector('#notice').textContent=warning}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(t,f,cls=''){let b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=f;return b}
function field(k,v='',hint=''){return '<label>'+esc(k)+'<textarea data-key="'+esc(k)+'" placeholder="'+esc(hint)+'">'+esc(v)+'</textarea></label>'}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){nav.replaceChildren(...['Board','Compass','Victory list','My P-DSP'].map(p=>button(p,()=>go(p),p===page?'active':'')));main.innerHTML='';if(page==='My P-DSP'){planPage();return}if(page==='Example'){examplePage();return}if(page==='Compass'){main.innerHTML='<h1>My compass</h1><p>Write the principles you want to carry onto the board. Your words save as you type.</p>'+compass.map((k,i)=>field(k,state.compass[k],cp[i])).join('')+'<details><summary>36 Pillars of Personal Power</summary><p>'+pillars.join(' · ')+'</p></details>';bind(state.compass);return}
if(page==='Quest'){quest();return}
if(page==='Victory list'){main.innerHTML='<h1>Victory list</h1><p>Every entry holds a goal you achieved and the evidence you brought back.</p>';let wins=state.quests.filter(q=>q.stage===2).reverse();if(!wins.length)main.insertAdjacentHTML('beforeend','<div class="panel">Your first victory starts with a quest on the board.</div>');wins.forEach(q=>card(q));return}
main.innerHTML='<section class="hero"><small>The Opus Board</small><h1>One life. Seven paths.</h1><p>Choose a domain, draw a pillar, and give yourself a real-world quest. Return with evidence to claim your victory.</p><a class="video-button" href="https://youtu.be/SOeKdIpeVXg?is=QjKJHro5xAWCjEZ1" target="_blank" rel="noopener noreferrer">Watch on YouTube ↗</a></section><h2>Choose your path</h2><div class="grid"></div><h2>My quests</h2>';domains.forEach((d,i)=>{let b=button('',()=>start(i),'tile');b.innerHTML='<span class="glyph">'+glyph[i]+'</span><b>'+d+'</b><span>'+hints[i]+'</span>';main.querySelector('.grid').append(b)});let open=state.quests.filter(q=>q.stage<2);if(!open.length)main.insertAdjacentHTML('beforeend','<p>Choose a path above to begin your first quest.</p>');open.slice().reverse().forEach(card)}
function bind(obj){main.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{obj[el.dataset.key]=el.value;save()})}
function card(q){let el=document.createElement('section');el.className='panel';el.innerHTML='<small>'+esc(q.domain)+' · '+(q.later?'Pending':['Anticipated draft','Anticipated','Achieved'][q.stage])+'</small><h3>'+esc(q.goal||'Untitled quest')+'</h3><p>'+esc(q.stage===2?q.proof:q.step||'Plan your next move.')+'</p>';el.append(button(q.stage===2?'View victory':'Open quest',()=>{id=q.id;go('Quest')}));main.append(el)}
function start(i){let used=new Set(state.quests.map(q=>q.pillar)),deck=pillars.filter(p=>!used.has(p));if(!deck.length)deck=pillars;let q={id:Date.now()+'-'+Math.random(),domain:domains[i],stage:0,pillar:deck[Math.floor(Math.random()*deck.length)],notes:{}};state.quests.push(q);id=q.id;save();go('Quest')}
function quest(){let q=state.quests.find(q=>q.id===id);main.innerHTML='<small>'+esc(q.domain)+' · '+(q.later?'Pending accomplishment':['Anticipated draft','Anticipated accomplishment','Achieved accomplishment'][q.stage])+'</small><h1>'+esc(q.stage===2?'Victory earned':q.domain+' quest')+'</h1><section class="hero"><small>Your pillar card</small><h2>'+esc(q.pillar)+'</h2><p>How could you practice '+esc(q.pillar.toLowerCase())+' while taking one step toward this goal?</p></section>';
if(q.later){main.insertAdjacentHTML('beforeend','<h2>'+esc(q.goal)+'</h2><p>Estimated completion · '+esc(q.due)+'</p>');main.append(button('Bring onto my board',()=>{q.later=false;q.stage=0;save();go('Quest')},'primary'));return}
if(q.stage===2){let el=document.createElement('section');el.className='panel';el.innerHTML='<small>'+esc(q.finished)+'</small><h2>'+esc(q.goal)+'</h2><p>'+esc(q.step)+'</p><h3>My evidence</h3><p>'+esc(q.proof)+'</p>';for(let [k,v] of Object.entries(q.notes))if(v.trim())el.innerHTML+='<b>'+esc(k)+'</b><p>'+esc(v)+'</p>';main.append(el,button('Return to board',()=>go('Board'),'primary'));return}
let form=document.createElement('form');form.innerHTML='<label>My goal<input required name="goal" placeholder="What will you accomplish?" value="'+esc(q.goal)+'"></label><label>Estimated start date<input required name="begin" type="date" value="'+esc(q.begin)+'"></label><label>Estimated completion date<input required name="due" type="date" value="'+esc(q.due)+'"></label><label>My next move<textarea required name="step" placeholder="One action you can take yourself">'+esc(q.step)+'</textarea></label>'+Object.entries(groups).map(([title,fields])=>'<details><summary>'+title+'</summary>'+fields.map(k=>field(k,q.notes[k],guidance[k])).join('')+'</details>').join('')+(q.stage===1?'<label>What did you do, and what shows it worked?<textarea name="proof" required>'+esc(q.proof)+'</textarea></label>':'')+'<button class="primary">'+(q.stage===0?'Commit to this quest':'Record victory')+'</button>';main.append(form);bind(q.notes);for(const el of form.querySelectorAll('[name]'))el.oninput=()=>{q[el.name]=el.value;el.setCustomValidity("");save()};form.onsubmit=e=>{e.preventDefault();for(const el of form.querySelectorAll('[name]')){if(!el.value.trim()){el.setCustomValidity('Enter a few words first.');el.reportValidity();return}q[el.name]=el.value.trim()}if(q.begin>q.due){form.elements.due.setCustomValidity('Choose an end date on or after your start.');form.elements.due.reportValidity();form.elements.due.setCustomValidity('');return}q.stage++;let today=new Date().toLocaleDateString();if(q.stage===1)q.started=today;else q.finished=today;save();go(q.stage===1?'Board':'Quest')}}
const noteKeys=Object.values(groups).flat();
const prompts=['Write a positive sentence beginning with I. Include the result and target date.','List milestones in order, one per line.','Picture the result. What can you see?','What sounds or words do you hear?','What sensations or emotions do you notice?','Recall a specific past success. Which part of this goal depends on your own actions?','What time, tools, people or space can you draw on? What else will you need?','What attitude will help you continue?','What belief will guide your choices?','Which trait will you practice?','Which practical and people skills will you use?','Name an internal or external obstacle and a way around it.','List the steps in order. Include when and where you will act.','Describe an ordinary day after success. What changes? What will you maintain?'];
const guidance=Object.fromEntries(noteKeys.map((k,i)=>[k,prompts[i]]));
const clean=v=>String(v??'').trim();
function gaps(s){
 const list=[];
 if(!clean(s.person))list.push('Add your name or nickname.');
 for(const k of compass)if(!clean(s.compass[k]))list.push('Compass · '+k);
 if(!s.quests.some(q=>q.stage<2&&!q.later))list.push('Choose an anticipated goal to refine.');
 for(const d of domains)if(!s.quests.some(q=>q.domain===d))list.push('Choose an anticipated or pending goal for '+d+'.');
 for(const q of s.quests.filter(q=>q.stage<2)){
 let missing=[];
 for(const [k,title] of [['goal','goal'],['due','estimated completion date']])if(!clean(q[k]))missing.push(title);
 if(!q.later){if(!q.begin)missing.push('estimated start date');if(q.begin>q.due)missing.push('date order');if(!clean(q.step))missing.push('next move');missing.push(...noteKeys.filter(k=>!clean(q.notes[k])))}
 if(missing.length)list.push((q.goal||q.domain)+' · '+missing.join(', '));
 }
 return list
}
function report(s,example=false){
 const block=(label,v)=>'<h4>'+esc(label)+'</h4><p>'+esc(clean(v)||'To be filled in')+'</p>';
 const lineup=(label,qs)=>'<h2>'+label+'</h2>'+(qs.length?'<dl>'+qs.map(q=>'<dt>'+esc(q.domain)+'</dt><dd>'+esc(q.goal||'Untitled goal')+' · '+esc(q.due||'Date open')+'</dd>').join('')+'</dl>':'<p>No entries yet.</p>');
 const active=s.quests.filter(q=>!q.later&&q.stage<2),later=s.quests.filter(q=>q.later);
 return '<article class="report"><small>Young Masters · '+(example?'Fictional worked example':gaps(s).length?'Working draft':'Complete plan')+'</small><h1>Personal Defined Success Plan</h1><p>'+esc(s.person||'Young Master')+'</p>'+lineup('Anticipated accomplishments',active)+lineup('Pending accomplishments',later)+'<h2>My compass</h2>'+compass.map(k=>block(k,s.compass[k])).join('')+'<h3>Pillars of Personal Power</h3><p>'+pillars.join(' · ')+'</p><h2>Refined accomplishments</h2>'+active.map(q=>'<section><h3>'+esc(q.goal||q.domain)+'</h3><p>'+esc(q.domain)+' · '+esc(q.begin||'Start open')+' → '+esc(q.due||'End open')+'</p>'+block('Pillar in practice',q.pillar)+block('Next move',q.step)+noteKeys.map(k=>block(k,q.notes[k])).join('')+'</section>').join('')+'<h2>Victory list</h2>'+(s.quests.some(q=>q.stage===2)?s.quests.filter(q=>q.stage===2).map(q=>block(q.goal,[q.domain,q.finished,q.proof].filter(Boolean).join(' · '))).join(''):'<p>Your first victory can be recorded when you have evidence.</p>')+'</article>'
}
function planPage(){
 let missing=gaps(state);
 main.innerHTML='<div class="tools"><h1>My P-DSP</h1><p>Give each domain a place in your plan. Refine the goals you can work on now and save future goals in the pending queue.</p><label>Young Master’s name or nickname<input id="person" value="'+esc(state.person)+'"></label><div class="row" id="actions"></div><details><summary>Add a pending goal</summary><form id="queue"><label>Life domain<select name="domain">'+domains.map(d=>'<option>'+d+'</option>').join('')+'</select></label><label>Future goal<input name="goal" required></label><label>Estimated completion<input name="due" type="date" required></label><button>Save pending goal</button></form></details><details><summary>Add a past victory</summary><form id="history"><label>Domain<select name="domain">'+domains.map(d=>'<option>'+d+'</option>').join('')+'</select></label><label>What did you achieve?<input name="goal" required></label><label>When?<input type="date" name="finished" required></label><label>What evidence do you have?<textarea name="proof" required></textarea></label><button>Save past victory</button></form></details><div id="readiness"></div></div><div id="document"></div>';
 function refresh(){let missing=gaps(state);document.querySelector('#readiness').innerHTML=missing.length?'<details><summary>Finish your plan · '+missing.length+' items to review</summary><ul>'+missing.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><p>Open Compass or the matching quest on the Board to fill in these items.</p></details>':'<p>Your plan is complete and ready to print.</p>';document.querySelector('#document').innerHTML=report(state)}
 document.querySelector('#person').oninput=e=>{state.person=e.target.value;save();refresh()};
 document.querySelector('#actions').append(button('Print / Save PDF',()=>window.print(),'primary'),button('Read a completed example',()=>go('Example')));
 for(const [selector,later] of [['#queue',true],['#history',false]])document.querySelector(selector).onsubmit=e=>{e.preventDefault();let form=e.target,data=Object.fromEntries(new FormData(form));for(const k of Object.keys(data)){data[k]=data[k].trim();if(!data[k]){form.elements[k].focus();return}}state.quests.push({...data,later,stage:later?0:2,id:Date.now()+'-'+Math.random(),pillar:pillars[Math.floor(Math.random()*pillars.length)],notes:{}});save();form.reset();refresh()};refresh()
}
function examplePage(){
 const s={person:'Jordan · sample Young Master',compass:Object.fromEntries(compass.map((k,i)=>[k,['I want the freedom to learn a trade and still have time for the people I love.','I see myself as a patient apprentice, a reliable brother, and someone who enjoys making things.','Last spring I attended eight Saturday workshops. I know how to protect a weekly practice hour.','I will practice one useful skill each week and keep the promises I make.','Learn the task, ask for feedback, and pass on what helped.','Honesty comes first when I make a mistake. Courage helps me ask for feedback. Patience helps me try again.'][i]])),quests:[]};
 const notes=['By April 30 I will finish a one-page résumé that I can confidently explain.','1. List three examples of my work.\n2. Draft the page.\n3. Proofread and save a PDF.','I see one clean page with my training and volunteer work.','I hear myself clearly explaining how I helped organize the tool shelf.','My shoulders relax when I read the final page aloud.','I wrote my workshop application last spring. I can use that draft and check each detail myself.','My workshop notes, a library computer, and two Saturday mornings.','I can improve a rough first draft.','My unpaid work taught me skills worth describing.','Honesty means describing exactly what I did.','Write short sentences, format a page, and ask a clear question.','If the library computers are booked, I will draft on paper and reserve the next slot.','April 3: list my experience at home. April 10: type the draft at the library. April 17: read it aloud. By April 30: correct it and save the PDF.','When an opportunity opens, I can find the file in my job folder and update it before applying.'];
 s.quests.push({domain:'Career',goal:'Finish my first résumé',stage:1,begin:'2027-04-01',due:'2027-04-30',step:'On Saturday I will list three things I did at the workshop.',pillar:'Honesty',notes:Object.fromEntries(noteKeys.map((k,i)=>[k,notes[i]]))});
 ['Learn a song on guitar','Finish a library course on spreadsheets','Save $30 for work supplies','Cook dinner with my brother','Volunteer at a neighborhood cleanup','Keep a four-week reflection journal'].forEach((goal,i)=>s.quests.push({domain:domains[i+1],goal,later:true,stage:0,due:'2027-'+String(i+5).padStart(2,'0')+'-28',notes:{}}));
 s.quests.push({domain:'Education',goal:'Attend eight Saturday workshops',finished:'2026-05-30',proof:'My attendance card has eight instructor initials.',stage:2});
 main.innerHTML='<div class="row tools"></div>'+report(s,true);main.firstChild.append(button('Back to my plan',()=>go('My P-DSP')),button('Print example',()=>window.print()))
}

render();document.querySelector('#notice').textContent=warning;
</script></html>
