<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Astral Plane</title><style>
*{box-sizing:border-box}body{margin:0;background:#080515;color:#f8e8ff;font-family:Georgia,serif;text-align:center}video,.sky{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.sky{background:radial-gradient(ellipse at 50% 40%,#57357488,transparent 60%),radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px) 0 0/79px 91px,#080515}video{opacity:.35}main{max-width:800px;margin:auto;padding:24px 16px}h1{font-size:clamp(30px,7vw,64px);letter-spacing:.08em;color:#f5d99b}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}a,button{color:inherit;background:#171027;border:1px solid #c9a96e;border-radius:12px;padding:12px;cursor:pointer;font:inherit}a{text-decoration:none}.stage{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:24px auto}.stage svg{position:absolute;inset:0;width:100%;height:100%}.gate{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 24px currentColor;display:grid;place-content:center;gap:5px;font-size:clamp(11px,3vw,17px)}.gate b{font-size:clamp(26px,7vw,48px);animation:float 4s ease-in-out infinite}.mother{left:50%;top:17%;color:#ffd69d}.mercy{left:21%;top:67%;color:#9de7d6}.wisdom{left:79%;top:67%;color:#d0b4ff}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:45px;animation:glow 5s infinite alternate}dialog{background:#130d24;color:#fff0dd;border:1px solid #c9a96e;border-radius:16px;width:min(92vw,620px);max-height:90dvh;padding:20px}dialog::backdrop{background:#000b}.screen{aspect-ratio:16/9;background:radial-gradient(ellipse,#51316a,#090511);border:1px solid #c9a96e;display:grid;place-items:center;overflow:hidden}.screen span{font-size:64px;animation:float 4s infinite}.screen video{position:static;opacity:1;z-index:auto}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}@keyframes float{50%{transform:translateY(-8px)}}@keyframes glow{to{opacity:.5}}body.still *{animation:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}video{display:none}}
</style></head><body><div class="sky"></div><video id="backdrop" muted loop playsinline hidden></video><main><nav><a href="../">🌹 Home</a><a href="../vital-plane/">↓ Vital Plane</a><button id="motion">Pause motion</button></nav><h1>The Astral Plane</h1><p>The Theatre of Cosmic Imagination</p><div class="stage"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="none" stroke="#b899d2"/><path d="M50 17 L21 67 L79 67 Z" fill="none" stroke="#e6c98d"/><circle cx="50" cy="50" r="14" fill="none" stroke="#e6c98d"/></svg><div class="core" aria-hidden="true">✧</div><button class="gate mother" data-i="0"><b>🌺</b>Mahadevi</button><button class="gate mercy" data-i="1"><b>🪷</b>Avalokiteshvara</button><button class="gate wisdom" data-i="2"><b>⚔️</b>Manjushri</button></div><p>Creation · Compassion · Wisdom</p><p>Three symbolic gateways. One field of imagination.</p></main><dialog id="chamber"><h2 id="name"></h2><div class="screen" id="screen"></div><p id="words"></p><p id="status">Animated prototype — film awaiting media.</p><button id="close">Return to the Astral Plane</button></dialog><script>
const media={background:'',scenes:['','','']};const scenes=[['Mahadevi','🌺','What can you create that nourishes life?'],['Avalokiteshvara','🪷','How can you respond to suffering with compassion?'],['Manjushri','⚔️','What assumption could you examine more carefully?']];const d=document.querySelector('#chamber'),bg=document.querySelector('#backdrop'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let paused=reduced;function motion(){document.body.classList.toggle('still',paused);document.querySelector('#motion').textContent=paused?'Resume motion':'Pause motion';document.querySelectorAll('video').forEach(v=>{if(paused)v.pause();else if(v===bg&&media.background)v.play().catch(()=>{})})}if(media.background){bg.src=media.background;bg.hidden=false}motion();document.querySelector('#motion').onclick=()=>{paused=!paused;motion()};document.querySelectorAll('.gate').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;document.querySelector('#name').textContent=scenes[i][0];document.querySelector('#words').textContent=scenes[i][2];let s=document.querySelector('#screen');s.replaceChildren();if(media.scenes[i]){let v=document.createElement('video');v.src=media.scenes[i];v.controls=true;v.playsInline=true;s.append(v);document.querySelector('#status').textContent='Cinematic encounter'}else{let el=document.createElement('span');el.textContent=scenes[i][1];s.append(el);document.querySelector('#status').textContent='Animated prototype — film awaiting media.'}d.showModal()});document.querySelector('#close').onclick=()=>d.close();d.onclose=()=>document.querySelector('#screen').replaceChildren();
</script></body></html>
