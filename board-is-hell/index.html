<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Is Hell</title><style>
*{box-sizing:border-box}body{margin:0;background:#050507;color:#ffe3a3;overflow:hidden;font-family:Georgia,serif}main{height:100dvh;display:grid;place-items:center;isolation:isolate}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2}h1{position:absolute;top:5%;margin:0;text-align:center;font-size:clamp(30px,7vw,80px);letter-spacing:.13em;text-shadow:0 2px #7b4415,0 0 24px #ffb950;color:#ffe3a3}button{cursor:pointer;color:inherit}#earth{width:min(66vw,52vh,480px);aspect-ratio:1;border-radius:50%;padding:12px;border:5px solid #a9a4a1;background:repeating-conic-gradient(#25252e 0deg 4deg,#a87937 4deg 5deg,#41414a 5deg 10deg);box-shadow:0 0 0 3px #322a27,0 0 0 6px #b99456,0 0 40px #ff6b32, inset 0 0 12px #000;position:relative}#earth span{display:block;width:100%;height:100%;border-radius:50%;background:url('../hell-earth.png') center/auto 98% no-repeat;background-color:#160303;box-shadow:none}#core{width:min(84vw,65dvh,620px);aspect-ratio:1;border:3px solid #a78c65;background:#08070c;box-shadow:0 0 0 5px #29232d,0 0 30px #a43c23;position:relative}#ladder{position:absolute;bottom:12px;right:12px;width:48px;height:48px;border-radius:50%;border:2px solid #bca36c;background:#211b22;font-size:25px} [hidden]{display:none!important}button:focus-visible{outline:3px solid white;outline-offset:8px}h1{font-family:Impact,'Arial Black',fantasy;font-weight:900;letter-spacing:.075em;font-size:clamp(32px,8vw,86px);color:#ffb12b;background:linear-gradient(0deg,#b51a00 0%,#ff4200 28%,#ffae16 55%,#fff4b0 80%,#ff8b12 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 3px #ffce48) drop-shadow(0 -5px 9px #ff4900) drop-shadow(0 -12px 18px #c52a00);animation:fireTitle 1.8s infinite alternate ease-in-out} @keyframes fireTitle{0%,100%{filter:drop-shadow(0 0 3px #ffce48) drop-shadow(0 -5px 9px #ff4900) drop-shadow(0 -12px 18px #c52a00)}35%{filter:drop-shadow(0 0 5px #ffe19a) drop-shadow(2px -8px 12px #ff6500) drop-shadow(-2px -16px 22px #e32c00)}70%{filter:drop-shadow(0 0 3px #ffb32b) drop-shadow(-2px -4px 8px #ff3800) drop-shadow(2px -10px 16px #c52a00)}}@media(prefers-reduced-motion:reduce){h1{animation:none}}#rose{position:absolute;top:calc(50% - min(33vw,26vh,240px) - 68px);left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:2px solid #c6a65d;background:#102619 url('../anton/green-rose-seal.png') center/cover no-repeat;box-shadow:0 0 15px #54bb73;z-index:2}#rosecore{width:min(84vw,65dvh,620px);aspect-ratio:1;border:3px solid #a78c65;background:#080c09;box-shadow:0 0 25px #337b49;position:relative;padding:18px}#roseplaceholder{width:100%;height:100%;border:1px solid #35513c}#roseback{position:absolute;bottom:12px;right:12px;width:48px;height:48px;border-radius:50%;border:2px solid #bca36c;background:#183322;font-size:25px}#earth{animation:earthGear 72s linear infinite}#rose{animation:roseGear 18s linear infinite}@keyframes earthGear{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes roseGear{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(-360deg)}}@media(prefers-reduced-motion:reduce){#earth,#rose{animation:none}}</style></head><body><main><canvas aria-hidden="true"></canvas><h1>BOARD IS HELL</h1><button id="rose" aria-label="Enter Green Rose Organization"></button><section id="rosecore" aria-label="Green Rose placeholder" hidden><div id="roseplaceholder"></div><button id="roseback" aria-label="Return to landing page">↩</button></section><button id="earth" aria-label="Enter the inner core"><span></span></button><section id="core" aria-label="Empty inner core" hidden><button id="ladder" aria-label="Climb out">🪜</button></section></main><script>
const earth=document.querySelector('#earth'),core=document.querySelector('#core'),ladder=document.querySelector('#ladder');const rose=document.querySelector('#rose'),rosecore=document.querySelector('#rosecore'),roseback=document.querySelector('#roseback');function openRose(v){rosecore.hidden=!v;earth.hidden=v;rose.hidden=v;core.hidden=true;(v?roseback:rose).focus()}rose.onclick=()=>openRose(true);roseback.onclick=()=>openRose(false);addEventListener('keydown',e=>{if(e.key==='Escape'&&!rosecore.hidden)openRose(false)});function enter(v){rose.hidden=v;earth.hidden=v;core.hidden=!v;(v?ladder:earth).focus()}earth.onclick=()=>enter(true);ladder.onclick=()=>enter(false);addEventListener('keydown',e=>{if(e.key==='Escape'&&!core.hidden)enter(false)});
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,x=0,y=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const stars=Array.from({length:260},()=>[Math.random(),Math.random(),Math.random(),Math.random()*6.28]);function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{x=e.clientX/w-.5;y=e.clientY/h-.5});function draw(t){if(reduced){t=0;x=0;y=0;}g.fillStyle='#050507';g.fillRect(0,0,w,h);for(let i=0;i<3;i++){let a=g.createRadialGradient(w*(.15+i*.35),h*(.3+i*.2),0,w*(.15+i*.35),h*(.3+i*.2),w*.6);a.addColorStop(0,['#15132355','#23152144','#101c2955'][i]);a.addColorStop(1,'#0000');g.fillStyle=a;g.fillRect(0,0,w,h)}for(const [a,b,d,p] of stars){g.fillStyle='rgba(220,230,255,'+(.35+.55*Math.abs(Math.sin(t*.001+p)))+')';g.beginPath();g.arc((a*w+x*d*30+t*.003*d+w)%w,(b*h+y*d*30+h)%h,.4+d*1.5,0,7);g.fill()}for(const [u,v,k,col,ring] of [[.14,.27,.085,'#826b53',true],[.85,.24,.047,'#547c9c',false],[.83,.78,.095,'#86534c',false],[.12,.76,.035,'#8c8a99',false],[.65,.14,.016,'#b6a18c',false]]){let px=u*w+(reduced?0:x*18+Math.sin(t*.00013+u)*5),py=v*h+(reduced?0:y*18),r=Math.min(w,h)*k;let a=g.createRadialGradient(px-r*.45,py-r*.45,0,px,py,r);a.addColorStop(0,col);a.addColorStop(.6,col);a.addColorStop(1,'#09090e');g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fillStyle=a;g.fill();if(ring){g.save();g.translate(px,py);g.rotate(-.35);g.strokeStyle='#9d886777';g.lineWidth=r*.12;g.beginPath();g.ellipse(0,0,r*1.65,r*.42,0,0,Math.PI);g.stroke();g.restore()}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
