const earth=document.querySelector('#earth'),core=document.querySelector('#core'),ladder=document.querySelector('#ladder');const rose=document.querySelector('#rose'),rosecore=document.querySelector('#rosecore'),roseback=document.querySelector('#roseback');function openRose(v){rosecore.hidden=!v;earth.hidden=v;rose.hidden=v;core.hidden=true;(v?roseback:rose).focus()}rose.onclick=()=>openRose(true);roseback.onclick=()=>openRose(false);addEventListener('keydown',e=>{if(e.key==='Escape'&&!rosecore.hidden)openRose(false)});function enter(v){rose.hidden=v;earth.hidden=v;core.hidden=!v;(v?ladder:earth).focus()}earth.onclick=()=>enter(true);ladder.onclick=()=>enter(false);addEventListener('keydown',e=>{if(e.key==='Escape'&&!core.hidden)enter(false)});
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,x=0,y=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const stars=Array.from({length:260},()=>[Math.random(),Math.random(),Math.random(),Math.random()*6.28]);function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{x=e.clientX/w-.5;y=e.clientY/h-.5});function draw(t){if(reduced){t=0;x=0;y=0;}g.fillStyle='#050507';g.fillRect(0,0,w,h);for(let i=0;i<3;i++){let a=g.createRadialGradient(w*(.15+i*.35),h*(.3+i*.2),0,w*(.15+i*.35),h*(.3+i*.2),w*.6);a.addColorStop(0,['#15132355','#23152144','#101c2955'][i]);a.addColorStop(1,'#0000');g.fillStyle=a;g.fillRect(0,0,w,h)}for(const [a,b,d,p] of stars){g.fillStyle='rgba(220,230,255,'+(.35+.55*Math.abs(Math.sin(t*.001+p)))+')';g.beginPath();g.arc((a*w+x*d*30+t*.003*d+w)%w,(b*h+y*d*30+h)%h,.4+d*1.5,0,7);g.fill()}for(const [u,v,k,col,ring] of [[.14,.27,.085,'#826b53',true],[.85,.24,.047,'#547c9c',false],[.83,.78,.095,'#86534c',false],[.12,.76,.035,'#8c8a99',false],[.65,.14,.016,'#b6a18c',false]]){let px=u*w+(reduced?0:x*18+Math.sin(t*.00013+u)*5),py=v*h+(reduced?0:y*18),r=Math.min(w,h)*k;let a=g.createRadialGradient(px-r*.45,py-r*.45,0,px,py,r);a.addColorStop(0,col);a.addColorStop(.6,col);a.addColorStop(1,'#09090e');g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fillStyle=a;g.fill();if(ring){g.save();g.translate(px,py);g.rotate(-.35);g.strokeStyle='#9d886777';g.lineWidth=r*.12;g.beginPath();g.ellipse(0,0,r*1.65,r*.42,0,0,Math.PI);g.stroke();g.restore()}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
const basement=document.querySelector('#basement'),gravityBox=document.querySelector('#gravityBox');let balls=[],bw=0,bh=0,rad=0,held=null,last=0;function initGravity(){bw=gravityBox.clientWidth;bh=gravityBox.clientHeight;rad=Math.min(bw/15,bh/12);if(!balls.length){for(let i=0;i<24;i++){const el=document.createElement('button');el.className='gravityBall';el.setAttribute('aria-label','Movable circle '+(i+1));gravityBox.append(el);const b={el,x:bw/2+(i%6-2.5)*rad*2.05,y:bh-rad-(Math.floor(i/6))*rad*2.05,vx:0,vy:0};balls.push(b);el.addEventListener('pointerdown',e=>{if(held)return;held=b;b.vx=b.vy=0;el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(held!==b)return;const q=gravityBox.getBoundingClientRect();b.x=Math.max(rad,Math.min(bw-rad,e.clientX-q.left));b.y=Math.max(rad,Math.min(bh-rad,e.clientY-q.top))});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(held===b)held=null});el.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();b.vx+=d[0]*100;b.vy+=d[1]*180}})}}for(const b of balls){b.el.style.width=b.el.style.height=2*rad+'px'}}function physics(t){requestAnimationFrame(physics);if(basement.hidden){last=t;return}const dt=Math.min(.025,(t-last)/1000||.016);last=t;for(const b of balls){if(b===held)continue;b.vy+=700*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.995}for(let k=0;k<8;k++){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>=2*rad)continue;if(d<.001){dx=.001;dy=0;d=.001}const nx=dx/d,ny=dy/d,p=2*rad-d,wa=a===held?0:1,wb=b===held?0:1,sum=wa+wb;if(!sum)continue;a.x-=nx*p*wa/sum;a.y-=ny*p*wa/sum;b.x+=nx*p*wb/sum;b.y+=ny*p*wb/sum;const v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(v<0){const imp=-1.05*v/sum;a.vx-=imp*nx*wa;a.vy-=imp*ny*wa;b.vx+=imp*nx*wb;b.vy+=imp*ny*wb}}for(const b of balls){if(b.x<rad){b.x=rad;b.vx=Math.abs(b.vx)*.2}if(b.x>bw-rad){b.x=bw-rad;b.vx=-Math.abs(b.vx)*.2}if(b.y<rad){b.y=rad;b.vy=Math.abs(b.vy)*.2}if(b.y>bh-rad){b.y=bh-rad;b.vy=-Math.abs(b.vy)*.08;b.vx*=.85}}}for(const b of balls){b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'}}document.querySelector('#basementDown').onclick=()=>{rosecore.hidden=true;basement.hidden=false;initGravity();document.querySelector('#basementUp').focus()};function upstairs(){held=null;basement.hidden=true;rosecore.hidden=false;document.querySelector('#basementDown').focus()}document.querySelector('#basementUp').onclick=upstairs;addEventListener('keydown',e=>{if(e.key==='Escape'&&!basement.hidden)upstairs()});addEventListener('resize',()=>{if(!basement.hidden)initGravity()});requestAnimationFrame(physics);const devilDialog=document.querySelector('#devilDialog');document.querySelector('#devilButton').onclick=()=>devilDialog.showModal();document.querySelector('#devilClose').onclick=()=>devilDialog.close();</script></body></html>
