<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Is Hell</title><style>
*{box-sizing:border-box}body{margin:0;background:#03030d;color:#ffe3a3;overflow:hidden;font-family:Georgia,serif}main{height:100dvh;display:grid;place-items:center;isolation:isolate}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2}h1{position:absolute;top:5%;margin:0;text-align:center;font-size:clamp(30px,7vw,80px);letter-spacing:.13em;text-shadow:0 2px #7b4415,0 0 24px #ffb950;color:#ffe3a3}button{cursor:pointer;color:inherit}#earth{width:min(66vw,52vh,480px);aspect-ratio:1;border-radius:50%;padding:12px;border:5px solid #a9a4a1;background:repeating-conic-gradient(#25252e 0deg 4deg,#a87937 4deg 5deg,#41414a 5deg 10deg);box-shadow:0 0 0 3px #322a27,0 0 0 6px #b99456,0 0 40px #ff6b32, inset 0 0 12px #000;position:relative}#earth span{display:block;width:100%;height:100%;border-radius:50%;background:url('../hell-earth.png') center/auto 103% no-repeat;box-shadow:inset 0 0 15px #000,0 0 8px #ff7928}#core{width:min(84vw,65dvh,620px);aspect-ratio:1;border:3px solid #a78c65;background:#08070c;box-shadow:0 0 0 5px #29232d,0 0 30px #a43c23;position:relative}#ladder{position:absolute;bottom:12px;right:12px;width:48px;height:48px;border-radius:50%;border:2px solid #bca36c;background:#211b22;font-size:25px} [hidden]{display:none!important}button:focus-visible{outline:3px solid white;outline-offset:8px}</style></head><body><main><canvas aria-hidden="true"></canvas><h1>BOARD IS HELL</h1><button id="earth" aria-label="Enter the inner core"><span></span></button><section id="core" aria-label="Empty inner core" hidden><button id="ladder" aria-label="Climb out">🪜</button></section></main><script>
const earth=document.querySelector('#earth'),core=document.querySelector('#core'),ladder=document.querySelector('#ladder');function enter(v){earth.hidden=v;core.hidden=!v;(v?ladder:earth).focus()}earth.onclick=()=>enter(true);ladder.onclick=()=>enter(false);addEventListener('keydown',e=>{if(e.key==='Escape'&&!core.hidden)enter(false)});
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,x=0,y=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const stars=Array.from({length:260},()=>[Math.random(),Math.random(),Math.random(),Math.random()*6.28]);function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{x=e.clientX/w-.5;y=e.clientY/h-.5});function draw(t){if(reduced)t=0;g.fillStyle='#03030d';g.fillRect(0,0,w,h);for(let i=0;i<3;i++){let a=g.createRadialGradient(w*(.15+i*.35),h*(.3+i*.2),0,w*(.15+i*.35),h*(.3+i*.2),w*.6);a.addColorStop(0,['#25134b88','#3c0d4388','#0c315088'][i]);a.addColorStop(1,'#0000');g.fillStyle=a;g.fillRect(0,0,w,h)}for(const [a,b,d,p] of stars){g.fillStyle='rgba(220,230,255,'+(.35+.55*Math.abs(Math.sin(t*.001+p)))+')';g.beginPath();g.arc((a*w+x*d*30+t*.003*d+w)%w,(b*h+y*d*30+h)%h,.4+d*1.5,0,7);g.fill()}for(let i=0;i<14;i++){let side=i%2,px=(side?w:0)+(side?-1:1)*(i%7)*w*.035+x*20,py=h*(.95-(i%4)*.09)+y*12,s=Math.min(w,h)*(.07+(i%3)*.04);g.beginPath();g.moveTo(px-s*.4,py);g.lineTo(px-s*.3,py-s*1.6);g.lineTo(px,py-s*2.4);g.lineTo(px+s*.35,py-s*1.5);g.lineTo(px+s*.4,py);g.closePath();let a=g.createLinearGradient(px-s,py,px+s,py-s);a.addColorStop(0,'#38266b');a.addColorStop(.5,'#a4e5ff88');a.addColorStop(1,'#d6b4ff44');g.fillStyle=a;g.fill();g.strokeStyle='#c3eaff88';g.stroke();g.beginPath();g.moveTo(px,py-s*2.4);g.lineTo(px,py);g.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
