<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House of Ra</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#28213a,#08090e 70%);color:#f6d38c;font-family:Georgia,serif}main{width:min(96%,1100px);padding:24px 0;text-align:center}h1{font-size:clamp(32px,7vw,76px);letter-spacing:.12em;margin:0 0 20px;text-shadow:0 0 24px #d9a24d88}.mosaic{aspect-ratio:1.7320508075688772;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:5px double #e5b65b;padding:3px;box-shadow:0 0 30px #b9863b66;background:#1d140a}.portal{position:relative;min-width:0;min-height:0;border:3px double #eac47a;background-image:url('./file_0000000068e881f6b44bab3d273a38b6.png');background-size:300% 300%;background-position:var(--x) var(--y);cursor:pointer;box-shadow:inset 0 0 12px #0008;transition:filter .25s,box-shadow .25s}.portal:before,.portal:after,.corner:before,.corner:after{content:"";position:absolute;width:12%;aspect-ratio:1;border:2px solid #ffe2a1;pointer-events:none}.portal:before{top:3px;left:3px;border-right:0;border-bottom:0}.portal:after{bottom:3px;right:3px;border-left:0;border-top:0}.corner:before{top:3px;right:3px;border-left:0;border-bottom:0}.corner:after{bottom:3px;left:3px;border-right:0;border-top:0}.portal:hover,.portal:focus-visible{z-index:1;filter:brightness(1.25);box-shadow:0 0 22px #ffe2a1,inset 0 0 15px #ffe2a1;outline:2px solid #fff0b5}.portal.selected{box-shadow:inset 0 0 30px #ffe2a1;filter:brightness(1.2)}#status{min-height:2em;letter-spacing:.08em;font-size:clamp(12px,2vw,18px)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><h1>HOUSE OF RA</h1><div class="mosaic" aria-label="Nine illuminated portals"><button class="portal" style="--x:0%;--y:0%" aria-label="Portal 1" data-n="1"><span class="corner"></span></button><button class="portal" style="--x:50%;--y:0%" aria-label="Portal 2" data-n="2"><span class="corner"></span></button><button class="portal" style="--x:100%;--y:0%" aria-label="Portal 3" data-n="3"><span class="corner"></span></button><button class="portal" style="--x:0%;--y:50%" aria-label="Portal 4" data-n="4"><span class="corner"></span></button><button class="portal" style="--x:50%;--y:50%" aria-label="Portal 5" data-n="5"><span class="corner"></span></button><button class="portal" style="--x:100%;--y:50%" aria-label="Portal 6" data-n="6"><span class="corner"></span></button><button class="portal" style="--x:0%;--y:100%" aria-label="Portal 7" data-n="7"><span class="corner"></span></button><button class="portal" style="--x:50%;--y:100%" aria-label="Portal 8" data-n="8"><span class="corner"></span></button><button class="portal" style="--x:100%;--y:100%" aria-label="Portal 9" data-n="9"><span class="corner"></span></button></div><p id="status" aria-live="polite">Select a portal</p></main><script>document.querySelectorAll('.portal').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.portal').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('status').textContent='Portal '+b.dataset.n+' — chamber awaiting development.'}));</script></body></html>
