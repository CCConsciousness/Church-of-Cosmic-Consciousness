<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Philosopher's Stone</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at center,#18243a 0%,#080d18 55%,#03050a 100%);color:#e9d6aa;font-family:Georgia,serif;display:grid;place-items:center}main{width:min(94vw,650px);text-align:center;padding:22px 0}h1{font-weight:normal;letter-spacing:.14em;font-size:clamp(1.1rem,4vw,1.6rem);margin:0 0 24px}.stone,.solid{border:1px solid #a98a50;background:radial-gradient(circle,#1d2636,#080b13);color:#e7c87f;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:transform .3s,box-shadow .3s;box-shadow:0 0 30px #d8ac4430}.stone:hover,.solid:hover,.solid:focus-visible{transform:scale(1.025);box-shadow:0 0 35px #d8ac4460}.stone{width:min(76vw,340px);margin:auto;padding:8%}.stone svg{width:100%;height:100%}svg{overflow:visible}.hidden{display:none!important}.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:540px;margin:auto}.solid{width:100%;flex-direction:column;padding:14px;gap:8px}.solid svg{width:65%;max-height:125px}.solid span{font-size:clamp(.75rem,2.7vw,1rem)}.back{border:1px solid #8c754e;color:#e9d6aa;background:transparent;padding:10px 20px;margin:22px auto;cursor:pointer}.playlists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.playlists a{border:1px solid #927a50;padding:24px 6px;color:#e9d6aa;text-decoration:none;background:#111b2b}.playlists a:hover{background:#27334b}p{color:#b6a786;font-size:.85rem}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(max-width:380px){.matrix{gap:8px}.solid{padding:7px}}
</style></head><body><main><section id="start"><h1>THE PHILOSOPHER'S STONE</h1><button class="stone" id="enter" aria-label="Open the Philosopher's Stone"><svg viewBox="0 0 240 240" fill="none" stroke="#e6c37a" stroke-width="1.4"><circle cx="120" cy="120" r="107"/><circle cx="120" cy="120" r="85"/><g id="ring"><circle cx="120" cy="65" r="55"/><circle cx="120" cy="175" r="55"/><circle cx="72.37" cy="92.5" r="55"/><circle cx="167.63" cy="92.5" r="55"/><circle cx="72.37" cy="147.5" r="55"/><circle cx="167.63" cy="147.5" r="55"/></g><polygon points="120,13 212.7,66.5 212.7,173.5 120,227 27.3,173.5 27.3,66.5"/><polygon points="120,40 189.3,160 50.7,160"/><polygon points="120,200 50.7,80 189.3,80"/><circle cx="120" cy="120" r="24" fill="#722c34" stroke="#f4c16b" stroke-width="3"/></svg></button></section>
<section id="four" class="hidden"><h1>FOUR GATEWAYS</h1><div class="matrix" id="matrix"></div><button class="back" id="home">Return to Stone</button></section>
<section id="collection" class="hidden"><h1 id="collectionTitle"></h1><div class="playlists" id="links"></div><button class="back" id="return">Return to Four Gateways</button></section></main>
<script>
const playlists=["PL_39VJI5VnWuXmGUWauDaNLvN5ssWnmAc","PL_39VJI5VnWsEY21lkFbMtTte1FecamGO","PL_39VJI5VnWtOERqIiMX_Yt3_wEwJ8J-O","PL_39VJI5VnWslKfsegFKYnslK3aUMwfRQ","PL_39VJI5VnWsdRQcmUh3tNuyrdo0RbkbN","PL_39VJI5VnWvcHp6c1aO1fq3ir-1-lwMK","PL_39VJI5VnWvbkUkqZa38hPoJtQEclDAW","PL_39VJI5VnWsT05y2pHAmjJsTh-E1qS30","PL_39VJI5VnWvNy-mRKjkhq_hxTzaWa0RT","PL_39VJI5VnWuC9OnKk86lBa_IjRHQWqHw"];
const solids=[
{name:"Tetrahedron",lines:[[50,8,8,84],[50,8,92,84],[8,84,92,84],[50,8,50,62],[50,62,8,84],[50,62,92,84]],items:[0,1,2]},
{name:"Cube",lines:[[50,7,90,30],[90,30,90,75],[90,75,50,98],[50,98,10,75],[10,75,10,30],[10,30,50,7],[10,30,50,53],[50,53,90,30],[50,53,50,98]],items:[3,4,5]},
{name:"Octahedron",lines:[[50,5,92,50],[92,50,50,95],[50,95,8,50],[8,50,50,5],[8,50,92,50],[50,5,50,95]],items:[6,7]},
{name:"Icosahedron",lines:[[50,4,91,28],[91,28,91,72],[91,72,50,96],[50,96,9,72],[9,72,9,28],[9,28,50,4],[50,4,31,40],[50,4,69,40],[9,28,31,40],[91,28,69,40],[31,40,69,40],[31,40,50,65],[69,40,50,65],[9,72,50,65],[91,72,50,65],[50,96,50,65],[31,40,50,96],[69,40,50,96]],items:[8,9]}];
const show=id=>{for(const s of ["start","four","collection"])document.getElementById(s).classList.toggle("hidden",s!==id)};
const svgFor=s=>'<svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#e6c37a" stroke-width="1.3">'+s.lines.map(l=>'<line x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'"/>').join("")+'</svg>';
solids.forEach((s,i)=>{const b=document.createElement("button");b.className="solid";b.innerHTML=svgFor(s)+"<span>"+s.name+"</span>";b.onclick=()=>{document.getElementById("collectionTitle").textContent=s.name;const box=document.getElementById("links");box.replaceChildren();s.items.forEach(n=>{const a=document.createElement("a");a.href="https://www.youtube.com/playlist?list="+playlists[n];a.target="_blank";a.rel="noopener noreferrer";a.textContent="Playlist "+String(n+1).padStart(2,"0")+" ↗";box.append(a)});show("collection")};document.getElementById("matrix").append(b)});
document.getElementById("enter").onclick=()=>show("four");document.getElementById("home").onclick=()=>show("start");document.getElementById("return").onclick=()=>show("four");
</script></body></html>
